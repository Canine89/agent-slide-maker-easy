<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>주제 이름 · Static Deck</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #111; font-family: system-ui, sans-serif; color: #F5F5F7; }
      body {
        display: flex; flex-direction: column;
        align-items: center; gap: 24px; padding: 24px 0;
      }
      .scene {
        width: 1920px; height: 1080px;
        background: #000;
        padding: 110px 140px;
        position: relative;
        flex-shrink: 0;
      }
      @media print {
        @page { size: 1920px 1080px; margin: 0; }
        body { display: block; padding: 0; gap: 0; }
        .scene { page-break-after: always; }
        .scene:last-child { page-break-after: auto; }
      }
    </style>
  </head>
  <body>

    <!-- 여기에 각 슬라이드를 정적 HTML로 적는다 (GSAP 없이, 최종 상태로) -->
    <div class="scene">
      <h1>주제 이름</h1>
      <p>첫 슬라이드 콘텐츠</p>
    </div>

  </body>
</html>
