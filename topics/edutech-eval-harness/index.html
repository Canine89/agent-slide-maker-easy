<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>_template</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0d0d12;
      font-family: "Paperlogy", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #f5f5f7;
    }
    #root { position: relative; width: 1920px; height: 1080px; }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }
    .eyebrow {
      font-size: 32px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #8b8bff;
      font-weight: 600;
    }
    .title { font-size: 132px; font-weight: 800; line-height: 1.05; }
    .subtitle { font-size: 40px; color: #b8b8c4; font-weight: 400; }
  </style>
</head>
<body>
  <!-- 1920x1080 / 16:9 · entrance-only · 마지막 씬에서만 exit 허용 -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">

    <!-- 씬 1: 타이틀 (data-skill=title) -->
    <section id="s-1" class="scene clip" data-skill="title"
             data-start="0" data-duration="6" data-track-index="0">
      <div class="eyebrow">TEMPLATE</div>
      <h1 class="title">새 주제 제목</h1>
      <p class="subtitle">topics/_template 을 복사해 시작하세요</p>
    </section>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 씬 1 entrance
    tl.from("#s-1 .eyebrow", { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 0.2)
      .from("#s-1 .title",   { opacity: 0, y: 40, duration: 0.8, ease: "power3.out" }, 0.4)
      .from("#s-1 .subtitle",{ opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 0.8);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
