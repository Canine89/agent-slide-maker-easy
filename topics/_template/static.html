<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>_template — static deck</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Paperlogy", "Inter", sans-serif;
      background: #1a1a22;
      color: #f5f5f7;
    }
    /* 16:9 페이지 — 브라우저 "PDF로 저장" 시 한 장이 한 슬라이드 */
    .page {
      width: 1280px;
      height: 720px;
      margin: 24px auto;
      background: #0d0d12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      page-break-after: always;
    }
    .eyebrow { font-size: 22px; letter-spacing: 0.4em; text-transform: uppercase; color: #8b8bff; font-weight: 600; }
    .title { font-size: 88px; font-weight: 800; }
    .subtitle { font-size: 28px; color: #b8b8c4; }
    @media print { body { background: #fff; } .page { margin: 0; } }
  </style>
</head>
<body>
  <section class="page">
    <div class="eyebrow">TEMPLATE</div>
    <h1 class="title">새 주제 제목</h1>
    <p class="subtitle">애니메이션 없는 정적 덱 — 페이지를 복제해 슬라이드를 늘리세요</p>
  </section>
</body>
</html>
